<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>nocreamIcecream | Dairy-Free Ice Cream Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;0,900;1,300;1,700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css">
<script src="javascript.js" defer></script>

</head>
<body>
<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="wrapper">
  <header>
    <div class="logo-badge"><span class="dot"></span>dairy-free finder</div>
    <h1>
      <span class="no">no</span><span class="cream">cream</span><br>
      <span class="ice">Ice</span><span class="cream2">Cream</span>
    </h1>
    <p class="tagline">find local shops &middot; discover non-dairy options &middot; eat happily</p>
  </header>

  <main>
    <section class="search-area" aria-label="Search for dairy-free ice cream shops">
      <div class="search-row">
        <input id="location-input" class="search-input" type="text" placeholder="City, neighborhood, or zip code..." aria-label="Location" />
        <button class="btn-find" id="find-btn" type="button">Find Shops</button>
      </div>
      <div class="location-hint">
        <span class="pin">&#128205;</span>
        <span>or <span id="use-location" style="cursor:pointer;text-decoration:underline;color:var(--mint)">use my location</span></span>
      </div>
    </section>

    <div id="status-area" aria-live="polite"></div>
    <div id="results"></div>
  </main>

  <footer>nocreamIcecream &middot; dairy-free discovery, designed with care</footer>
</div>
</body>
</html>
